<input
  class="checkbox"
  type="checkbox"
  [checked]="task().completed"
  [attr.aria-label]="task().completed ? 'Mark task as incomplete' : 'Mark task as complete'"
  (change)="toggled.emit(task().id)"
/>

<div class="body">
  @if (editing()) {
    <input
      #editInput
      class="edit"
      type="text"
      appAutofocus
      [value]="draft()"
      [attr.aria-label]="'Edit ' + task().title"
      (input)="onEditInput($event)"
      (keydown)="onEditKeydown($event)"
      (blur)="commitEdit()"
    />
  } @else {
    <span class="title" (dblclick)="startEditing()">{{ task().title }}</span>
  }

  @if (task().projectName) {
    <span class="project">{{ task().projectName }}</span>
  }
</div>

<div class="actions">
  @if (!editing()) {
    <button type="button" class="icon" aria-label="Edit task" (click)="startEditing()">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
      </svg>
    </button>
  }

  <button
    type="button"
    class="icon danger"
    aria-label="Delete task"
    (click)="removed.emit(task().id)"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M3 6h18" />
      <path d="M8 6V4h8v2" />
      <path d="M19 6l-1 14H6L5 6" />
      <path d="M10 11v5M14 11v5" />
    </svg>
  </button>
</div>
