<form class="task-input" (submit)="$event.preventDefault(); addTask(input)">
  <label class="sr-only" for="new-task">New task</label>
  <input
    #input
    id="new-task"
    type="text"
    placeholder="What needs to be done?"
    autocomplete="off"
    [value]="draft()"
    (input)="onInput($event)"
  />
  @if (projects().length > 0) {
    <label class="sr-only" for="task-project">Project</label>
    <select id="task-project" [value]="selectedProject()" (change)="onProjectChange($event)">
      <option value="">No project</option>
      @for (project of projects(); track project.id) {
        <option [value]="project.id">{{ project.name }}</option>
      }
    </select>
  }
  <button type="submit" [disabled]="!draft().trim()">Add</button>
</form>
