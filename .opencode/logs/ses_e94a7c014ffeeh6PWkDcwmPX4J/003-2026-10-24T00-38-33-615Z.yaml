kStore uses WorldModel only.\n- MemoryService uses HMEM.\n- PlanningService uses Markovian.\n- ScoutService injects TaskStore, MemoryService, PlanningService.\n- Assistant component injects ScoutService.\n\n- App component injects TaskStore and maybe ScoutService for assistant. Add `<app-assistant />` and `<app-engine-panel />`.\n\n- High-risk confirmation: For task.delete, ScoutService returns decision with risk high; UI shows \"Confirm\" button. We can implement in assistant component: if decision.risk.level === 'high' and requires approval, show confirmation buttons. On confirm, call execute. For email.send/deal.update intents not in app registry, not applicable. For app `task.delete`, high. Also `task.clear` maybe high.\n- Clarification: show options; clicking option sets prompt or executes chosen intent. Simpler show question and options as buttons that call `answer(option)` which re-runs with a synthetic prompt. Could just display; but functionality better. We'll implement options with `value` prompt.\n\n- Memory panel: show list, query input, feedback buttons. Sleep/dream actions. Maybe show only recent 8.\n- Activity panel: show world model audit entries and plan history. Planning panel: \"Plan a goal\" input; run deterministic Markovian; display chunks and efficiency. This is separate from Scout `task.plan` intent, which can trigger planning with prompt.\n- Could combine: `EnginePanel` with tabs \"Memory\", \"World\", \"Plans\". Use signals.\n\nGiven time, implement solid but not overly elaborate.\n\n### Testing\n\n- Add unit tests for Scout core (eval corpus? We can write Vitest tests for app intents and injection). But conformance is main.\n- Add tests for H-MEM/World/Markovian? Conformance covers. Add app service tests maybe.\n- Run build/test.\n\n### Conformance execution setup\n\n- `npm install` in `/home/ext_root/lab-data/meterless-spec/engines/scout-intent` for yaml/tsx. Alternatively add `yaml` and `tsx` to app devDeps and run runner from app? ESM resolution for yaml from runner path fails. Could set `NODE_PATH` no. Install in spec folder. For H-MEM/WM/Markovian runners, they only import tsx? They import `node:*` and our impl; `npx tsx` needed. If no package.json, `npx tsx` downloads. We can use app's `node_modules/.bin/tsx` after adding tsx devDep to app. Running `/home/.../angular-todo-app/node_modules/.bin/tsx /home/.../runner.ts` works; runner's imports of `yaml` still resolve from spec folder, so install yaml there. Or install in each engine folder. We'll do `npm install` in scout-intent; for others use app tsx.\n- Node entry files at app root `eval/`:\n  - `eval/scout-entry.ts`\n  - `eval/hmem-entry.ts`? H-MEM conformance points directly to `src/app/engines/hmem/index.ts`; no fs. Same for WM/Markovian. Only Scout needs file loading wrapper.\n- For Scout eval, `SCOUT_IMPL=/home/.../angular-todo-app/eval/scout-entry.ts`. The runner imports with tsx; wrapper reads JSON. Good.\n\n### Scout implementation details (write code)\n\nLet's design types:\n\n```ts\nexport type RiskLevel = \"low\" | \"medium\" | \"high\" | \"block\";\nexport interface IntentParameterSchema { type?: string; properties?: Record<string, ...>; required?: string[] }\nexport interface IntentDefinition { id, category, description, parameters, capabilities, riskClass: \"low\"|\"medium\"|\"high\", surfaces: string[], roles: string[], examples: string[], version: number }\nexport interface IntentRegistry { version: number; intents: IntentDefinition[] }\nexport interface UserRef { id: string; role?: string }\nexport interface DecisionInput { prompt: string; user?: UserRef; surface?: string; context?: unknown }\nexport interface IntentCandidate { intent: string; score: number; span?: [number, number]; }\nexport interface Clarification { question: string; options: { label: string; intent?: string; prompt?: string }[]; trigger: string }\nexport interface ToolStep { capability: string; tool: string; input?: Record<string, unknown> }\nexport interface RiskAssessment { level: RiskLevel; flags: string[]; redactions: string[]; reason?: string; approvals: ApprovalRecord[] }\nexport interface ExecutionContract {...}\nexport interface Decision { intent: {...}; candidates; risk; toolPlan; clarification?; executionContract; ...}\n```\n\nNeed `Scout` class methods:\n- constructor options; load registry; validate; set secret.\n- `decide(input)`: \n  1. `classify` (sync but async method).\n  2. interpret top + candidates.\n  3. guard.\n  4. route.\n  5. recommend + sign.\n  Returns Decision.\n- `classify(input)`: returns candidates.\n- `replan({parent, reason, state})`: can return a decision with parentId? For simplicity, not used. Implement by returning a decision? Needs prompt; parent contract lookup. We can store contracts by id. `replan` takes parent id, reason, state; find parent, create a new decision based on parent's intent/prompt? We can store prompt. For spec completeness, implement minimal: if parent found, re-run decide with parent prompt; set parentId. But no prompt in contract. Store `lastDecisions` map with prompt. Or accept `state` with prompt. We'll implement:\n```\nasync replan({parent, reason, state}) {\n  const prev = this.decisions.get(parent);\n  if (!prev) throw ...\n  const prompt = (state as any)?.prompt ?? prev.prompt;\n  const d = await this.decide({prompt, ...prev.input});\n  d.executionContract.parentId = parent;\n  return d;\n}\n```\nNeed re-sign after setting parentId? Re-sign. Good enough.\n- `verifyContract(contract)`: recompute HMAC and check expiry; useful for app/downstream. Implement async.\n- `canonicalJson` helper.\n\nScoring algorithm:\n```\nnormalize(text): lowercase, replace punctuation with spaces, collapse.\ntokens = normalized.split(' ').filter(len>1)\nstem? no.\nphraseMatch(example, prompt): if prompt includes normalized example or example includes prompt (for short) -> 1.\ntokenScore(intent):\n  intentTokens = unique tokens from id (split . and -), description, examples (weighted)\n  coverage = matched weight / total weight? \n```\nWe need robust for eval. Let's compute:\n- For each intent, examples are strong. If any example is a substring of prompt (after normalization) or prompt is substring of example, score high.\n- For eval, prompts are exactly examples or close. E.g., \"Find me the top 5 stuck deals and draft recovery emails\" exact example. \"The Acme deal hasn't moved in three weeks. What should I do?\" exact. \"Give me 10 at-risk renewals with recovery plans\" exact. \"What's the status of the GlobeX renewal?\" exact. \"Show me all deals in negotiation stage over $100k\" exact. \"Move the Initech deal to closed-won at $280k\" exact. Email exact. Research exact. Plan exact. Edge \"Show me the Acme deal\" exact example in deal.query. \"Email Maya about the renewal\" exact. So exact match handles all intent examples. For app, we'll include examples for common commands and use token overlap for variations.\n- Use exact example match -> lexical = 1.0. Confidence = 0.98 (High). If no exact, token overlap:\n  - Build weighted token set from id parts, category, description, examples. Common stopwords removed.\n  - Compute coverage of intent tokens present in prompt and prompt tokens present in intent tokens; score = 0.6*coverageIntent + 0.4*coveragePrompt maybe. Or Jaccard.\n  - Add trigger phrase weights for id words (e.g., \"deploy\").\n- Need avoid GENERAL winning due to its examples \"what can you help me with\" etc. For app, GENERAL tokens generic. Score threshold .4. For unknown prompts, GENERAL should win or no intent. We can special-case GENERAL: if no other intent score >= .35, return GENERAL with score .3. If an intent has weak score, maybe clarification.\n- For \"Handle the Acme situation\": exact none; token overlap with deal.query/deal.recover due to \"acme\"; score maybe .3; below threshold. Then GENERAL, but expected clarification true. Add vague detection: if prompt matches /^(handle|do|deal with|sort out|take care of