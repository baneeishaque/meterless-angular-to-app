              if (!token) {
                return null;
              }

              return { baseUrl: `${url.origin}/v1`, token };
            } catch {
              return null;
            }
          }

          export function isMeterlessConnectLink(raw: string): boolean {
            return parseMeterlessConnectLink(raw) !== null;
          }

          function withScheme(value: string): string {
            if (/^[a-z][a-z0-9+.-]*:\/\//i.test(value)) {
              return value;
            }

