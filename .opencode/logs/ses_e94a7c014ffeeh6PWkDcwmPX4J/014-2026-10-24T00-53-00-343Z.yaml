          import { ChangeDetectionStrategy, Component, computed, inject, signal } from '@angular/core';
          import {
            METERLESS_PLACEHOLDER_TOKEN,
            MeterlessProviderService,
          } from '../../providers/meterless-provider.service';

          @Component({
            selector: 'app-provider-panel',
            changeDetection: ChangeDetectionStrategy.OnPush,
            templateUrl: './provider-panel.html',
            styleUrl: './provider-panel.css',
          })
          export class ProviderPanel {
            protected readonly provider = inject(MeterlessProviderService);
            protected readonly draftUrl = signal(this.provider.baseUrl());
            protected readonly tokenDraft = signal('');
            protected readonly prompt = signal('');
            protected readonly error = signal<string | null>(null);

            protected readonly showToken = computed(
              () => this.provider.status() !== 'online' || !this.provider.hasToken(),
            );
            protected readonly modelOptions = computed(() => {
              const current = this.provider.model();
              return [current, ...this.provider.models().filter((model) => model !== current)];
            });

            protected onUrlInput(event: Event): void {
              this.draftUrl.set((event.target as HTMLInputElement).value);
            }

            protected onTokenInput(event: Event): void {
              this.tokenDraft.set((event.target as HTMLInputElement).value);
            }

            protected onPromptInput(event: Event): void {
              this.prompt.set((event.target as HTMLInputElement).value);
            }

            protected async connect(): Promise<void> {
              this.error.set(null);
              const status = await this.provider.connect(this.draftUrl());
              this.draftUrl.set(this.provider.baseUrl());

              if (status === 'unauthorized') {
                this.error.set('The token was rejected. Paste the token from proxy-token.');
              } else if (status === 'offline') {
                this.error.set(this.provider.lastError() ?? 'The runtime is offline.');
              }
            }

            protected async autoDetect(): Promise<void> {
              this.error.set(null);
              const status = await this.provider.autoDetect();
              this.draftUrl.set(this.provider.baseUrl());

              if (status === 'unauthorized') {
                this.error.set('Runtime found. Paste the token from proxy-token.');
              } else if (status === 'offline') {
                this.error.set(this.provider.lastError() ?? 'No runtime found.');
              }
            }

            protected saveToken(): void {
              this.error.set(null);
              if (!this.provider.setToken(this.tokenDraft())) {
                this.error.set(this.provider.lastError() ?? 'Paste a valid token.');
                return;
              }

              this.tokenDraft.set('');
              void this.provider.checkStatus();
            }

            protected async importToken(event: Event): Promise<void> {
              const input = event.target as HTMLInputElement;
              const file = input.files?.[0];
              if (!file) {
                return;
              }

              this.error.set(null);
              if (!(await this.provider.loadTokenFromFile(file))) {
                this.error.set(this.provider.lastError() ?? 'The token file was rejected.');
              } else {
                void this.provider.checkStatus();
              }
              input.value = '';
            }

            protected onModelChange(event: Event): void {
              this.provider.setModel((event.target as HTMLSelectElement).value);
            }

            protected async send(): Promise<void> {
              const text = this.prompt().trim();
              if (!text) {
                return;
              }

              this.error.set(null);
              try {
                await this.provider.chat(text);
              } catch (error) {
                this.error.set((error as Error).message);
              }
            }

            protected readonly placeholderToken = METERLESS_PLACEHOLDER_TOKEN;
          }
          ---HTML---
          <section class="panel" aria-labelledby="provider-title">
            <header class="panel-head">
              <div>
                <p class="eyebrow">OpenAI-compatible</p>
                <h2 id="provider-title">Meterless Runtime</h2>
              </div>
              <span
                class="badge"
                [class.online]="provider.status() === 'online'"
                [class.warn]="provider.status() === 'unauthorized'"
              >
                {{ provider.status() }}
              </span>
            </header>

            <p class="hint">
              Local runtime at <code>127.0.0.1:8088</code>. Paste a URL or a <code>/connect#k=…</code> link.
              Status comes from <code>/v1/models</code>.
            </p>

            <form class="endpoint" (submit)="$event.preventDefault(); connect()">
              <label for="meterless-url">Base URL</label>
              <div class="row">
                <input
                  id="meterless-url"
                  type="text"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="http://127.0.0.1:8088/v1"
                  [value]="draftUrl()"
                  (input)="onUrlInput($event)"
                />
                <button type="submit" [disabled]="provider.busy()">Connect</button>
              </div>
              <button type="button" class="secondary" (click)="autoDetect()" [disabled]="provider.busy()">
                Auto Detect
              </button>
            </form>

            @if (showToken()) {
              <form class="token" (submit)="$event.preventDefault(); saveToken()">
                <label for="meterless-token">
                  Token
                  <span
                    >from <code>&lt;stateDir&gt;/proxy-token</code>; <code>{{ placeholderToken }}</code> is
                    rejected</span
                  >
                </label>
                <div class="row">
                  <input
                    id="meterless-token"
                    type="password"
                    autocomplete="off"
                    placeholder="Paste the runtime token"
                    [value]="tokenDraft()"
                    (input)="onTokenInput($event)"
                  />
                  <button type="submit">Save token</button>
                </div>
                <label class="file">
                  Import proxy-token
                  <input type="file" accept="text/plain" (change)="importToken($event)" />
                </label>
              </form>
            }

            @if (provider.models().length > 0) {
              <label class="model" for="meterless-model">
                Routing mode
                <select id="meterless-model" [value]="provider.model()" (change)="onModelChange($event)">
                  @for (model of modelOptions(); track model) {
                    <option [value]="model">{{ model }}</option>
                  }
                </select>
              </label>
            }

            <form class="chat" (submit)="$event.preventDefault(); send()">
              <label for="meterless-prompt">Plain-text request</label>
              <div class="row">
                <input
                  id="meterless-prompt"
                  type="text"
                  autocomplete="off"
                  placeholder="Ask meterless/auto…"
                  [value]="prompt()"
                  (input)="onPromptInput($event)"
                />
                <button type="submit" [disabled]="provider.busy() || !prompt().trim()">Send</button>
              </div>
            </form>

            @if (provider.lastReply(); as reply) {
              <pre class="reply">{{ reply }}</pre>
            }

            @if (error(); as message) {
              <p class="error" role="alert">{{ message }}</p>
            }
          </section>
