          export function parseMeterlessConnectLink(raw: string): MeterlessConnectLink | null {
            const value = raw.trim();
            if (!value) {
              return null;
            }

            try {
              const url = new URL(withScheme(value));
              if (url.protocol !== 'http:' && url.protocol !== 'https:') {
