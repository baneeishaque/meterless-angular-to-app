              private contextualScore(prompt: string, intent: IntentDefinition, context: unknown): number {
                const contextText = contextToString(context);
                if (!contextText) {
                  return 0;
                }

                const contextTokens = new Set(tokenize(contextText));
                const intentTokens = new Set(
                  tokenize(
                    [intent.id, intent.description, ...intent.examples, ...(intent.triggers ?? [])].join(' '),
                  ),
                );

                if (contextTokens.size === 0 || intentTokens.size === 0) {
                  return 0;
                }

                let overlap = 0;
                for (const token of intentTokens) {
                  if (contextTokens.has(token)) {
                    overlap += 1;
                  }
                }

                return Math.min(1, overlap / Math.min(8, intentTokens.size));
              }
            }

            function contextToString(context: unknown): string {
              if (!context) {
                return '';
              }
              if (typeof context === 'string') {
                return context;
              }
              if (typeof context !== 'object') {
                return '';
              }

              const value = context as {
                memory?: { text?: string };
                world?: { text?: string };
                contextPlan?: ContextPlan;
              };

              return [value.memory?.text, value.world?.text].filter(Boolean).join('\n');
            }
