      **Where each combined mechanism plugs in**

      | # | Combined prompt | Integration point | User benefit | Phase |
      | :--- | :--- | :--- | :--- | :--- |
      | 1 | Memory plus long tasks | `PlanningService.planFromContract` → Markovian chunk 0; `MemoryService.recordPlanCompletion` | Plans remember preferences and prior outcomes | 3 |
