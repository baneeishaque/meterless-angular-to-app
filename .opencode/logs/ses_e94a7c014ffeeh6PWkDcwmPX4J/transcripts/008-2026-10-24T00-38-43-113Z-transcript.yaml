      | 3 | Route long jobs to Markovian | `AssistantService` → `PlanningService.planFromContract` after contract verification | Bounded, resumable plans | 3 |
      | 4 | World state into memory | `EngineSyncService` subscribes to World events → `MemoryService.upsertWorldFact` | Assistant remembers completed/archived tasks | 4 |
      | 5 | Plan from the world model | `WorldModelService.buildPromptContext` → Scout context plan → Markovian | Plans name real open tasks | 2 |
      | 6 | Many drafts, shared state | Optional `PlanningService.planAlternatives` with one World snapshot | Compare fast vs thorough plans | 6 optional |
      | 7 | Full stack in one agent | New `AssistantPipelineService` + trace panel | One coherent, auditable assistant | 5 |
      | 8 | Upgrade the starter | Umbrella equivalent of 1-5 and 7 | Combined behavior without a rewrite | 1-5 |
      | 9 | Research agent that remembers | Optional `task.research` + RESEARCH mode | Repeated research reuses prior findings | 7 optional |
      | 10 | Accounts remember people | Optional project entities + project-scoped memory | Project plans use project tasks/preferences | 8 optional |

