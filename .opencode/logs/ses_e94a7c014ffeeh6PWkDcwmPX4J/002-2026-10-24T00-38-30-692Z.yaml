          - top-1: 16/17 (`0.941`)
          - top-3: 17/17 (`1.000`)
          - injection precision: 7/7 (`1.000`)
          - injection recall: 7/7 (`1.000`)
          - tool: 14/15 (`0.933`)
          - clarification: at most 4/32 (`0.125`)
          - overrides: 0

