          === markovian-with-hmem ===
          # Markovian with H-MEM

          > Run it: `npx tsx index.ts` (uses the reference implementation in [`../../reference`](../../reference)).

          > **Marker note:** this walkthrough uses the XML alternate (`<CARRYOVER>`, `<DONE>`) of the canonical bracket protocol (`[STATE_CHECKPOINT]` / `[TASK_COMPLETE]`). See [docs/marker-protocol.md](../../docs/marker-protocol.md) for the 1:1 mapping.

          [H-MEM](https://github.com/meterless/meterless/tree/main/engines/hmem) feeds chunk zero with relevant prior memories, and the final run output is mined back into memory. Today's long run then informs next week's.

          > Memory enters at step 1 only. After that, bounded carryover maintains continuity. H-MEM is not re-queried every chunk.

          Prerequisite reading: [`docs/architecture.md`](../../docs/architecture.md), and the `01-add-memory` example in the [H-MEM engine](https://github.com/meterless/meterless/tree/main/engines/hmem).

          ---

          ## The contract (from the how-to §13)

          ```text
          hmem.query  ─▶ formatReinjection ─▶ memoryContext ─▶ Markovian chunk 0 ONLY
                                                                    │
                                                                    ▼
                                                    run completes → hmem.ingest("plan_completion")
          ```

          Heavy context enters once; the compressed carryover carries continuity forward. The completed run becomes a new memory for future runs.

          ## Walkthrough: `index.ts`

          ```ts
          import { Markovian } from "@meterless/markovian";
          import { HMEM } from "@meterless/hmem";

          const hmem = new HMEM({ storage: "local", namespace: "agent-cleo" });
          const markovian = new Markovian({ chunkConfig: { chunkSize: 6000, carryoverTokens: 900 } });

          const userPrompt = "Plan the Q3 analytics-warehouse migration.";

          // 1. Pull relevant memory BEFORE the run (past decisions, constraints, prefs).
          const { memories } = await hmem.query({ text: userPrompt, topN: 5 });
          const memoryContext = formatReinjection(memories);
          // → "[infra] (long_term) Team standardized on AWS Glue catalog. {entities: Glue}\n..."

          // 2. Inject it into chunk ZERO only via memoryContext.
          const run = await markovian.run({
            goal: userPrompt,
            memoryContext,                     // engine prepends this to step 1's prompt only
            stepFn: myStepFn,
            stopWhen: ({ output }) => output.includes("<DONE>"),
          });

          // 3. Mine the completed run back into H-MEM as a durable memory.
          await hmem.ingest({
            eventType: "plan_completion",
            source: `markovian:${run.id}`,
            content: run.chunks.map((c) => c.content).join("\n\n"),
          });

          console.log(run.output);
          ```

          ## Run it

          ```bash
          # No npm package is published. This repo is an implementation spec.
          # Point the imports at your implementations of the engine contracts (see ../../AGENTS.md), then:
          npx tsx ./index.ts
          ```

          ## Expected behavior

          ```text
          hmem.query → 5 memories (incl. "Team standardized on AWS Glue catalog")
          chunk 0 prompt includes that memory → the plan picks Glue WITHOUT re-deciding it
          chunks 1..N → bounded carryover only (memory NOT re-injected)
          run completes → hmem.ingest stores the plan as a plan_completion memory
          next week: a new migration run's hmem.query surfaces THIS plan as prior context
          ```

          ## The closing loop

          | Phase | Engine | Effect |
          | --- | --- | --- |
          | Before | H-MEM `query` | retrieves the Glue-catalog decision from a past run |
          | Chunk 0 | Markovian | the plan inherits that decision instead of re-litigating it |
          | Chunks 1..N | Markovian | carryover only; flat cost preserved |
          | After | H-MEM `ingest` | this plan becomes memory for the next planning run |

          ---

          ## Why it matters

          - **Memory enters at chunk zero only.** Re-injecting H-MEM every chunk would defeat the O(1) property, because the prompt would grow with retrieved memory each step. The contract (`memoryContext` → step 1 only) keeps Markovian flat and memory-aware.
          - **The two engines have complementary jobs.** H-MEM decides what past knowledge is relevant. Markovian decides how to reason through a long task without re-paying for it. Neither does the other's job.
          - **The loop makes long-horizon work cumulative.** A plan that ignores last quarter's decisions repeats them. `ingest("plan_completion")` lets the agent build on its earlier runs.

          ## Next

          - The `markovian-handoff` example in the [H-MEM engine](https://github.com/meterless/meterless/tree/main/engines/hmem): the same loop, seen from inside H-MEM.
          - [`markovian-inside-swarm`](../markovian-inside-swarm/README.md): the other composition seam.
          - H-MEM's reinjection model: [H-MEM](https://github.com/meterless/meterless/tree/main/engines/hmem).

          === hmem markovian-handoff ===
          # Markovian handoff

          > Cross-engine example: this folder has no runnable code yet. Treat the code below as a reference sketch of the contract.

          H-MEM is the memory a long [Markovian](https://github.com/meterless/meterless/tree/main/engines/markovian) run starts from and writes back to. This example is the H-MEM side of the loop: what `query` serves into chunk zero, and what `ingest` absorbs when the run completes.

          > The reciprocal example, `markovian-with-hmem`, lives in the [Markovian engine folder](https://github.com/meterless/meterless/tree/main/engines/markovian). It focuses on the chunked run; this one focuses on the memory contract feeding and closing it.

          Prerequisite reading: [`04-retrieve-and-reinject`](../04-retrieve-and-reinject/README.md), [`docs/reinjection.md`](../../docs/reinjection.md).

          ---

          ## The loop, from memory's side

          ```text
          hmem.query  ──serves──▶  memoryContext  ──▶  Markovian chunk 0 (once, never re-queried)
                                                               │
                                                               ▼  run completes
          hmem.ingest("plan_completion")  ◀──absorbs──  joined chunk content
          ```

          H-MEM does two things and nothing else here: retrieve the relevant prior decisions before the run, and mine the finished run back as a durable memory.

          ## Walkthrough (illustrative reference API)

          The code below is a reference sketch of the contract, not a runnable package. This repo is the implementation spec, and no `@meterless/*` npm packages are published. The `@meterless/hmem` and `@meterless/markovian` imports stand for your own implementations.

          ```ts
          import { HMEM } from "@meterless/hmem";
          import { Markovian } from "@meterless/markovian";

          const hmem = new HMEM({ storage: "local", namespace: "agent-cleo" });

          const prompt = "Plan the Q3 analytics-warehouse migration.";

          // 1. Memory's job #1: retrieve what past runs already decided.
          const { memories } = await hmem.query({ text: prompt, topN: 5 });
          // → [ "[infra] (long_term) Team standardized on AWS Glue catalog. {entities: Glue}", ... ]

          const markovian = new Markovian({ chunkConfig: { chunkSize: 6000, carryoverTokens: 900 } });
          const run = await markovian.run({
            goal: prompt,
            memoryContext: formatReinjection(memories),   // enters chunk 0 ONLY
            skipSemanticMemoryAugmentation: true,         // lower layers must NOT retrieve a second time
            stepFn: myStepFn,
            stopWhen: ({ output }) => output.includes("[TASK_COMPLETE]"),
          });

          // 2. Memory's job #2: absorb the completed run as a new durable memory.
          await hmem.ingest({
            eventType: "plan_completion",
            source: `markovian:${run.id}`,
            content: run.chunks.map((c) => c.content).join("\n\n"),
          });

          // Prove the loop closed: the new memory is now retrievable.
          const next = await hmem.query({ text: "warehouse migration plan", topN: 1 });
          console.log(next.memories[0].source);   // → "markovian:<runId>"
          ```

          ## Expected behavior (illustrative)

          ```text
          hmem.query  → 5 memories (incl. the Glue-catalog decision from a prior run)
          markovian   → plan inherits Glue WITHOUT re-deciding it (memory in chunk 0)
          hmem.ingest → run stored as a plan_completion memory, source=markovian:<runId>
          hmem.query  → next migration question now surfaces THIS plan as prior context
          ```

          ## What `ingest("plan_completion")` actually does

          | Step | H-MEM behavior |
          | --- | --- |
          | receive run content | classified as a `plan_completion` event |
          | mine | extract durable facts/decisions, not the raw transcript |
          | enrich | domain, entities, `source: markovian:<runId>` provenance |
          | store | written to the working tier, audited in the trust ledger |
          | later | eligible for retrieval, dreaming, and sleep like any memory |

          The completed Markovian run does not get dumped verbatim. It is mined the same way a chat or document is (see [`02-mine-from-chat`](../02-mine-from-chat/README.md)).

          ---

          ## Why it matters

          - **H-MEM makes long runs cumulative.** Markovian gives flat per-step cost; H-MEM is what stops the next run from re-deciding what this one already settled. Without the `ingest` step, every migration plan starts from zero.
          - **Retrieval feeds chunk zero, not every chunk.** H-MEM serves context once. Re-injecting per chunk would defeat Markovian's O(1) property. The memory contract respects the engine boundary on purpose. That is also why `skipSemanticMemoryAugmentation: true` is passed down: a chunked generator whose lower layer also auto-augments prompts with memory would retrieve twice.
          - **The handoff is provenanced both ways.** What entered the run is a `query` trace; what left it is a `plan_completion` memory tagged `markovian:<runId>`. The full round trip is auditable from the ledger.

