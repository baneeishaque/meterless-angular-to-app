          # Read surface

          The canonical store is for writing. Reads come from **views**: derived, rebuildable, projection-shaped surfaces optimized for specific access patterns.

          > Readable ids in the snippets below (`team:bengals`, `season:145`) are display labels; canonical stable ids follow the grammar in [`stable-ids.md`](./stable-ids.md).

          ## The principle

          > The canonical store is the source of truth. Every view can be thrown away and rebuilt from it.

          This is the test of a healthy World Model deployment. If a view drifts from the store, you wipe it and re-project. The store does not change.

          ## Built-in views

          ### Graph view

          For relational and traversal queries.

          ```ts
          const roster = await world.view("graph").neighborsOf("team:bengals", {
            via: "plays-for",
            inContext: "season:145",
          });

          const bloodline = await world.view("graph").traverse("player:tommie-frazier-iii", {
            via: "child-of",
            direction: "ancestors",
            maxDepth: 5,
          });
          ```

          Backed by an adjacency-list projection. Rebuilt by replaying `relate` events.

          ### Timeline view

          For time-bounded queries across entities and events.

          ```ts
          const articles = await world.view("timeline").entitiesOfType("article", {
            from: "2026-05-01",
            to: "2026-05-31",
          });

          const seasonGames = await world.view("timeline").contextChildren("season:145", {
            type: "game",
          });
          ```

          Backed by an interval-indexed projection. Rebuilt by replaying `upsertEntity`, `upsertContext`, and `snapshot` events.

          ### Search view

          For text-similarity and embedding queries.

          ```ts
          const results = await world.view("search").entities({
            text: "Fed rate decision",
            types: ["article", "event"],
            limit: 20,
          });
          ```

          Backed by an embedding index (default: client-side; pluggable). Rebuilt by re-embedding entity text fields.

          ### Snapshot view

          Point-in-time state of any entity or context.

          ```ts
          const teamAt = await world.view("snapshot").entityAt("team:bengals", "2087-12-01");
          ```

          Backed by event-log fold up to a given timestamp.

          ## Custom projections

          Most production deployments need a domain-specific projection: a CRM dashboard view, a roster page, a campaign analytics view.

          ```ts
          world.registerView("roster", {
            events: ["relate", "upsertEntity"],
            initialState: {},
            reducer: (state, event) => {
              if (event.kind === "relate" && event.payload.type === "plays-for") {
                const team = event.payload.to;
                state[team] ??= [];
                state[team].push(event.payload.from);
              }
              return state;
            },
          });

          const bengalsRoster = await world.view("roster").get("team:bengals");
          ```

          The view declares which events it cares about. The runtime replays them. The projection is materialized incrementally as new events append.

          ## Read-your-writes

          A write is durable when the event has appended. Views project asynchronously by default, but you can request **read-your-writes consistency** for a single call:

          ```ts
          await world.upsertEntity({ ... });
          const view = await world.view("graph").waitForConsistency().neighborsOf(...);
          ```

          Use sparingly. The async path is faster and more scalable.

          ## Subscriptions

          Views can be subscribed to.

          ```ts
          const unsub = world.view("timeline").subscribe({
            type: "article",
            from: "2026-05-17",
          }, (diff) => {
            console.log("new articles:", diff.added);
          });
          ```

          Subscriptions push diffs, not full states. Used by the control plane and by long-running agents.

          ## What views are *not*

          Views are derivations of the canonical store.

          - **Don't write to a view.** Writes go to the canonical store.
          - **Don't trust a stale view.** Rebuild it.
          - **Don't expose a view as your only persistence layer.** The store is the truth.

          If you find yourself wanting to write to a view, you want a new entity type, a new context, or a new fact.

          === stable ids ===
          # Stable IDs

          IDs in World Model are **deterministic, content-addressable, and never renumbered**. This is the property that makes ingest idempotent, merges safe, and re-imports lossless.

          ## The rules

          1. **Every entity, context, and relationship has a stable ID.**
          2. **IDs are derived, not assigned.** Same input → same ID.
          3. **IDs survive merges.** A merged entity keeps both originals as aliases.
          4. **IDs survive schema migrations.** The schema version changes; the ID does not.
          5. **IDs survive re-imports.** Importing the same source twice produces the same IDs.

          ## How IDs are derived

          The default ID strategy is a content hash over a canonical key set.

          ### Entities

          Two forms, one grammar:

          - **Externally keyed** (preferred whenever an authoritative external identifier exists):

            ```
            id = `${type}:${system}:${externalId}`     // e.g. account:salesforce:0015g00000A1b2cAAA
            ```

          - **Name keyed** (the fallback when no external key exists):

            ```
            id = `ent_${sha256(`${type}:${normalizeName(name)}`).hex.slice(0, 16)}`
            normalizeName = lowercase → NFKD → strip combining marks → collapse whitespace → trim
            ```

          Which external key to pin is a deterministic, type-specific decision (`canonicalKey`):

          | Entity type | Canonical key |
          |---|---|
          | `article` | `url` or `(publisher, slug)` |
          | `person` | normalized full name + DOB if known, else externalId |
          | `account` | CRM external ID |
          | `player` | normalized name + bloodline marker |
          | `event` | source + native event ID |

          Type-specific canonical keys are declared in your schema and **versioned**. Changing them produces a migration, not a renumbering.

          ### Contexts

          ```
          id = hash(type + canonicalKey(attrs) + parent?)
          ```

          Same shape, but a context's ID includes its parent, so `week:14` under `season:145` is a different ID than `week:14` under `season:144`.

          ### Relationships

          ```
          id = hash(from + type + to + context? + validFrom?)
          ```

          Relationships have stable IDs too, so adding the same edge twice is a no-op.

          ## Aliases

          When two entities turn out to be the same (operator merge, or automated entity resolution), one becomes the **primary** and the other becomes an **alias**.

          ```ts
          type Alias = {
            aliasId: EntityId;
            primaryId: EntityId;
            mergedAt: ISODate;
            mergedBy: string;
            reason: string;
          };
          ```

          Old references to the alias ID **still resolve**. The read surface follows alias pointers transparently. The event log preserves both, so an unmerge is a one-step rollback.

          ## Externalized IDs

          For entities that have authoritative external identifiers (Salesforce IDs, ISBNs, DOIs), World Model lets you pin the canonical key:

          ```ts
          await world.upsertEntity({
            type: "account",
            externalKey: { system: "salesforce", id: "0015g00000A1b2cAAA" },
            attrs: { name: "Acme Corp" },
            source: { kind: "api" },
          });
          ```

          The ID is then `account:salesforce:0015g00000A1b2cAAA` (the literal externally-keyed form) and stays consistent across every system that knows about that account.

          ## Why content hashes, not UUIDs

          UUIDs make ingest non-idempotent: re-ingesting the same article generates a new ID. Content-addressed IDs collapse duplicates at the boundary, which is the property you want at the canonical-store layer.

          If you need opaque external IDs for users to copy-paste, expose them through a separate handle layer. Don't compromise the canonical ID strategy to make URLs prettier.

          ## When IDs change

          They don't. Not after a merge (aliases handle that), not after a schema migration (the schema version is independent), not after a re-import (canonical key is stable).

          The only case where an ID changes is **explicit re-keying**: an operator decides that the canonical key for a type was wrong, declares a migration, and the system replays the event log with the new key. The old IDs become aliases of the new ones. Old references still resolve.

          This is the property the rest of the system depends on.
