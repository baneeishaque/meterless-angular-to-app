        result: |
          # Execution contract

          The execution contract is the only thing downstream engines accept. Swarm, Markovian, H-MEM, and World Model never act on a raw user prompt. They act on contracts.

          This is the most important property in the Scout design.

          ## The shape

          ```ts
          type ExecutionContract = {
            // Identity
            contractId: string;            // ULID, monotonic
            parentId?: string;             // for re-planning, refinements
            traceId: string;               // for telemetry correlation

            // Decision
            intent: {
              primary: IntentRef;
              parameters: Record<string, unknown>;
              references: Record<string, EntityRef>;
              confidence: number;
              alternates: IntentCandidate[];
            };

            // Risk
            risk: {
              level: "low" | "medium" | "high";
              flags: RiskFlag[];
              redactions: Redaction[];
              approvals: ApprovalRecord[];
            };

            // Plan
            toolPlan: ToolStep[];
            modelProfile: ModelProfileRef;

            // Scope
            scope: {
              user: UserRef;
              surface: string;
              capabilities: CapabilityRef[];  // exact set, enforced downstream
              deadline?: ISODate;
              budget?: { tokensMax?: number; costMaxUSD?: number };
            };

            // Provenance
            issuedAt: ISODate;
            expiresAt: ISODate;
            registryVersion: number;
            policyPackVersion: string;

            // Signature
            signature: string;             // HMAC over canonical encoding
            signedBy: "scout";
          };
          ```

          ## Why a contract, not a function call

          Three reasons.

          **1. Scope enforcement.** A function call says what to do. A contract says what is allowed. Downstream engines verify that every tool they invoke is in the contract's `capabilities` set. A swarm task that tries to call a tool outside scope gets refused at the boundary by the executor itself, not by a wrapper.

          **2. Auditability.** A function call is a transient event. A contract is a durable artifact. Every action your system takes can be traced back to a specific contract, with the exact intent, risk assessment, and plan that authorized it. Replay is straightforward.

          **3. Decoupling.** Without a contract, every agent has to re-implement intent classification, risk checks, and routing. With a contract, all that lives in Scout. Agents become executors of contracts, which makes them simpler and easier to test.

          ## Signing

          The contract is signed with HMAC over the canonical JSON encoding:

          ```
          signature = HMAC_SHA256(secret, canonical_json(contract_without_signature))
          ```

          The secret is per-deployment, stored locally. Downstream engines verify on receipt.

          This is an integrity check, not a cryptographic-grade defense. It catches:

          - Accidental mutation of the contract in transit between modules
          - Misconfigured downstream engines accepting hand-crafted plans
          - Replay of expired contracts after `expiresAt`

          If you need stronger guarantees (multi-party signing, distributed enforcement), swap the signer for a real signing service. The interface is pluggable.

          ## Expiration

          Contracts expire. Default TTL is 5 minutes. Downstream engines refuse contracts past `expiresAt`.

          Why short: a contract represents a decision made with specific context. Five minutes later, the context may have changed: the user revoked permissions, the data class shifted, a policy update went live. The short TTL forces a new decision instead of letting old plans go stale.

          Long-running work (a research swarm, a multi-day reflection) refreshes contracts: each new chunk or phase asks Scout for a fresh contract bound to the current parent.

          ## Re-planning

          When a downstream engine can't fulfill a step (a tool went offline, a confidence threshold tightened, a verification failed), it doesn't muddle through. It calls Scout again with the original contract as `parentId` and a `reason` for re-planning.

          ```ts
          const replanned = await scout.replan({
            parent: originalContract.contractId,
            reason: "tool.email.send unavailable",
            state: currentState,
          });
          ```

          The new contract has the same trace ID. Telemetry tracks the chain.

          ## Approval records

          For `high`-risk intents or any contract that triggered `requireApproval`, the contract carries an `approvals` array:

          ```ts
          [
            { kind: "user-confirm", at: "2026-05-18T12:34:56Z", confirmation: "yes" },
            { kind: "operator-review", by: "operator-7", at: "...", decision: "approve" },
          ]
          ```

          Engines verify required approvals are present before acting. Missing approval → refused.

          ## Telemetry hooks

          Every contract emits structured telemetry at issue time and on every downstream verification:

          ```
          contract.issued      contractId=… intent=… risk=… profile=… latencyMs=…
          contract.verified    contractId=… engine=swarm verified=true
          contract.expired     contractId=… engine=markovian
          contract.refused     contractId=… engine=world-model reason=scope-mismatch
          ```

          See [`telemetry-and-learning.md`](./telemetry-and-learning.md).

          ## Anti-patterns

          - **Don't add fields downstream.** The contract is immutable post-signature. Adding fields means re-issuing.
          - **Don't extend TTL.** If a long task needs more time, refresh the contract. Don't move the goalposts.
          - **Don't accept unsigned contracts.** Even in dev. Make signature verification mandatory at every boundary.
          - **Don't store contracts as the system of record.** They're a handoff format, not a database. Persist telemetry; the contracts themselves are short-lived.

          ## What's next

          - [Eval harness](./eval-harness.md): measuring contract quality
          - [Telemetry and learning](./telemetry-and-learning.md): what the contract trail teaches you

          === model routing ===
          # Model routing

          Scout picks a model that fits each task: a cheap one for classification, a capable one for synthesis, a local one for sensitive data, a fast one for streaming, and a careful one for high-risk work.

          ## Model profiles

          A model profile declares a model with its constraints and cost. Scout's model router picks a profile per task in the plan based on the intent, the risk class, and the deployment context.

          ```json
          {
            "id": "default-fast",
            "provider": "openai",
            "model": "gpt-4.1-nano",
            "context": 128000,
            "cost": { "in": 0.0001, "out": 0.0004 },
            "latency": { "p95Ms": 800 },
            "capabilities": ["text", "function-calling"],
            "dataClasses": ["public"]
          }
          ```

          ```json
          {
            "id": "local-capable",
            "provider": "webllm",
            "model": "llama-3.1-8b-instruct",
            "context": 32000,
            "cost": { "in": 0, "out": 0 },
            "latency": { "p95Ms": 4000 },
            "capabilities": ["text", "json-mode"],
            "dataClasses": ["public", "internal", "confidential", "restricted"]
          }
          ```

          ## Routing rules

          The router scores profiles against the request:

          1. **Compatibility**: the profile must support the capabilities the task needs (function calling, JSON mode, vision).
          2. **Data class**: the profile must be cleared for the data class of the input.
          3. **Context budget**: the profile must fit the full prompt + carryover.
          4. **Cost target**: if a budget is set, prefer profiles under it.
          5. **Latency target**: same.
          6. **Quality target**: risk-class `high` intents prefer high-quality profiles.

          Default tie-break: local profiles win over remote when data class is `confidential` or `restricted`.

          ## Per-task routing

          A single execution contract often has multiple tasks. Each gets routed independently.

          ```
          task: classify_intent      → profile: default-fast
          task: extract_entities     → profile: default-fast
          task: draft_recovery_email → profile: default-capable
          task: verify_compliance    → profile: local-capable  (data class: confidential)
          ```

          ## Fallback chains

          Profiles can declare fallbacks. If the primary fails (rate limit, network, model error), the router tries the next.

          ```json
          {
            "id": "default-fast",
            "fallbacks": ["default-capable", "local-fast"]
          }
          ```

          Fallbacks must satisfy the same data-class constraint. A profile cleared only for `public` data won't be used as a fallback for `confidential` data, even if its primary is.

          ## Cost ceilings

          You can declare a cost ceiling per intent or per surface:

          ```yaml
          costCeilings:
            intent.deal.recover:
              perInvocation: 0.05  # USD
            surface.chat:
              perDay: 5.00
          ```

          The router rejects any plan whose estimated cost exceeds the ceiling. The estimation uses token counts at plan time; the surface gets back a structured "cost ceiling" error if there's no fitting profile.

          ## Local-first defaults

          Scout ships with two default chains:

          - **Local-first chain**: `local-fast` → `local-capable` → `remote-fast`
          - **Cloud-first chain**: `remote-fast` → `remote-capable` → `local-capable`

          The local-first chain is the default. To opt into cloud-first, set `routing: "cloud-first"` in the config.

          ## BYOK model

          Every remote profile requires user-supplied API keys. Scout doesn't proxy. There's no Meterless-hosted model gateway. The key lives client-side; the call goes direct to the provider.

          The execution contract records which profile ran each task, never the key. Telemetry stays local-first.

          ## Why route at the Scout layer

          Putting model selection inside agent code couples each agent to a model. Changing models means rewriting agents. Putting it in Scout means:

          - A single config change rolls a new model across every intent that uses that profile.
          - Cost ceilings are enforced before execution, not after the bill arrives.
          - Data-class compliance is enforceable at the boundary.
          - The eval harness can measure whether the right profile got picked, in addition to whether the output is good.

          ## What's next

          - [Execution contract](./execution-contract.md): how profile selection gets carried forward
          - [Eval harness](./eval-harness.md): measuring routing decisions
          - [Telemetry and learning](./telemetry-and-learning.md): using routing data to improve
