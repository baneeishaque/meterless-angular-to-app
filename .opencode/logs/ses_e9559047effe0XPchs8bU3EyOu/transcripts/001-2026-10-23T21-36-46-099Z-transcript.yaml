    Read https://github.com/Meterless/Meterless/blob/main/docs/architecture/stack-overview.md and the engine overviews in docs/engines/.

    I’ll describe my product and stack below. Show me exactly where memory (H-MEM), shared state (World Model), long-task compression (Markovian) and intent routing (Scout Intent) would plug in, what each would improve for my users, and what I should NOT adopt yet.

    My product:
    Build a simple, responsive **To-Do List app using Angular**.

    Requirements:
    - Add new tasks.
    - Mark tasks as completed or incomplete.
    - Edit and delete tasks.
    - Filter tasks by All, Active, and Completed.
    - Display the total number of remaining tasks.
    - Save tasks in `localStorage` so they persist after refreshing the page.
    - Use Angular best practices and standalone components.
    - Create a clean, modern UI with minimal styling, good spacing, and mobile responsiveness.
    - Show an empty state when there are no tasks.

    Keep the app simple, functional, and easy to understand. Avoid unnecessary dependencies and backend services.

