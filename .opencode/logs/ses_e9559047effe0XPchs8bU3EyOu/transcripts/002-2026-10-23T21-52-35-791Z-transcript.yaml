      - H-MEM key semantics: source mandatory; feedback deltas `helpful +0.05/+1 access`, `not_helpful -0.03`, `wrong -0.20 + review tag`, clamp 0..1; retrieval formula `0.35*semantic + 0.20*keyword + 0.10*tag + 0.10*domain + 0.15*entity + 0.05*layer + 0.05*recency - 0.20*superseded`, then `* confidence`; threshold `0.35`, top N `5`; conflict auto-resolve at `>= 0.70`; dreaming approval-only; sleep preview-first with hub/derived/superseding guardrails.
