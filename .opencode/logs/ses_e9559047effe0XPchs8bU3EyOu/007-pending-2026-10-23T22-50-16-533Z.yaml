          138:   not lost to terminal scroll-back.
          139: - Any future probe / installer / build wrapper that needs to keep the terminal clean while preserving
          140:   output for audit.
          141: 
          142: ## 6. Prohibited Behaviors
          143: 
          144: - Writing scratch output to `/tmp/` (loss-on-reboot, no co-location).
