                            from: entity.id,
                            type: 'mentions',
                            to: this.store.resolveAlias(mid),
                            validFrom: source.at,
                            schemaVersion: 1,
                            source,
                            createdAt: source.at,
                          } as Relationship,
                          source.at,
                        );
                      }
                    }
                    return { entityId: entity.id, entityIds: entityIds.sort() };
                  },
