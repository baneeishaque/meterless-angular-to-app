eterless/raw/refs/heads/main/docs/architecture/stack-overview.md)\n\nCopy raw file\n\nDownload raw file\n\nOutline\n\nEdit and raw actions\n\n# Stack Overview\n\n[](#stack-overview)\n\nThe Meterless Runtime sits in the middle of the stack. During the day it answers requests from your apps. At night, Nightshift uses the same machine to run queued jobs.\n\n[![Animated: apps call the Meterless provider; the Meterless Runtime and Nightshift serve them by day and race jobs by night on the open engines and your own hardware](/Meterless/Meterless/raw/main/docs/images/meterless-stack.svg)](/Meterless/Meterless/blob/main/docs/images/meterless-stack.svg)\n\n```\nYour apps        Cursor, Claude Code, Gaia, Relay, Swarms, Meterless City, Sitcomify, DataPlant\n   ↓\nMeterless provider   OpenAI-compatible, 127.0.0.1:8088/v1, meterless/* routing modes\n   ↓\nMeterless Runtime + Nightshift\n   ├─ Day (Depth posture)     serve every connected app, one lane per request\n   └─ Night (Swarm posture)   race queued jobs, scribes read, clusters form,\n                              judges and checks settle the Outcome Contract\n   ↓\nOpen engines     Scout Intent · H-MEM · World Model · Markovian · Swarm\n   ↓\nYour hardware    Apple Silicon Mac · NVIDIA DGX Spark · Windows PC\n   ↓\nKept work + signed receipts + Methods and Skills, on your disk\n```\n\n## Layer by layer\n\n[](#layer-by-layer)\n\nLayer\n\nWhat it is\n\nStatus\n\nApps\n\nCoding agents, the free Meterless apps, the experiments, anything that speaks the OpenAI API\n\n[Free apps](/Meterless/Meterless/blob/main/docs/products/README.md) and [experiments](/Meterless/Meterless/blob/main/docs/experiments/README.md) shipping\n\nProvider\n\nOne OpenAI-compatible endpoint with routing modes instead of model names\n\nContract public: [add-meterless-provider.md](/Meterless/Meterless/blob/main/docs/agent-ready/add-meterless-provider.md)\n\nRuntime and Nightshift\n\nLocal AI production control plane: jobs, fleets, lanes, checks, Outcome Contract, makes, receipts, two postures\n\n[Nightshift](/Meterless/Meterless/blob/main/docs/products/nightshift/README.md): web live, Windows out now, Mac preorder, free Mac M1+ edition, DGX on request\n\nIntent detection and routing\n\n[Scout Intent](/Meterless/Meterless/blob/main/engines/scout-intent)\n\nSpec + eval harness\n\nDurable memory\n\n[H-MEM](/Meterless/Meterless/blob/main/engines/hmem)\n\nSpec + runnable reference\n\nState modeling\n\n[World Model](/Meterless/Meterless/blob/main/engines/world-model)\n\nSpec + runnable reference\n\nReasoning compression\n\n[Markovian](/Meterless/Meterless/blob/main/engines/markovian)\n\nSpec + runnable reference\n\nMulti-agent coordination\n\nSwarm orchestration\n\nShips inside the apps. Spec drop next, see [roadmap](/Meterless/Meterless/blob/main/ROADMAP.md)\n\nQuality, cost and latency routing\n\nRuntime\n\nShips inside Nightshift. Spec drop next, see [roadmap](/Meterless/Meterless/blob/main/ROADMAP.md)\n\n## How the engines compose\n\n[](#how-the-engines-compose)\n\n-   **H-MEM feeds Markovian.** Memory seeds chunk zero of a long run and mines the output back into memory. The [memory-compounding demo](/Meterless/Meterless/blob/main/examples/memory-compounding-research) shows the warm run finishing in 8 chunks instead of 12.\n-   **World Model feeds H-MEM.** Sourced facts replicate into memory and answer scoped queries planned upstream.\n-   **Scout plans before anything acts.** Downstream engines act only on its signed execution contracts.\n-   **Markovian is the `deliberate` job kind.** In Nightshift, one long chain of chunks carries a compressed summary forward and checkpoints.\n-   **All three together make a small model feel large.** Meterless City runs an 8B model with Markovian state, H-MEM memory and a World Model event log per character.\n\nEach engine's examples folder shows these pairings from its own side.\n\n## Product surfaces\n\n[](#product-surfaces)\n\nSurface\n\nRole\n\nDocs\n\nNightshift\n\nThe flagship: AI hotspot by day, overnight production by night\n\n[docs/products/nightshift/](/Meterless/Meterless/blob/main/docs/products/nightshift/README.md)\n\nGaia\n\nPersistent workspace\n\n[docs/products/gaia/](/Meterless/Meterless/blob/main/docs/products/gaia/README.md)\n\nRelay\n\nRepeatable desktop workflows\n\n[docs/products/relay/](/Meterless/Meterless/blob/main/docs/products/relay/README.md)\n\nSwarms\n\nCoordinated, divergent generation\n\n[docs/products/swarms/](/Meterless/Meterless/blob/main/docs/products/swarms/README.md)\n\nExperiments\n\nWhat the runtime unlocks\n\n[docs/experiments/](/Meterless/Meterless/blob/main/docs/experiments/README.md)\n\n## Footer\n\n[](https://github.com)© 2026 GitHub,\_Inc.\n\n### Footer navigation\n\n-   [Terms](https://docs.github.com/site-policy/github-terms/github-terms-of-service)\n-   [Privacy](https://docs.github.com/site-policy/privacy-policies/github-privacy-statement)\n-   [Security](https://github.com/security)\n-   [Status](https://www.githubstatus.com/)\n-   [Community](https://github.community/)\n-   [Docs](https://docs.github.com/)\n-   [Contact](https://support.github.com?tags=dotcom-footer)\n-   Manage cookies\n-   Do not share my personal information\n\nYou can’t perform that action at this time."
