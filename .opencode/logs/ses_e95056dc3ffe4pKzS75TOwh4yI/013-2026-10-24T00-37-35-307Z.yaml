          910: #### 3i — Selective Hunk Extraction via Diff Patching
          911: 
          912: When `git add -p` hunk boundaries don't align with the logical boundary
          913: (common in Markdown table rows, contiguous prose sections, or adjacent
          914: list items), and the complementary `stage-file-excluding-lines.py` (§2f.1)
          915: is the wrong tool because you want to stage ONLY the matching content
          916: (rather than exclude it), use the `stage-hunk-from-diff.py` script:
          917: 
          918: This script reads the file's diff, parses it into hunks, keeps only
          919: hunks whose content matches one or more `--match` / `--match-regex`
          920: patterns, and stages them via `git apply --cached`. Non-matching hunks
          921: remain unstaged; the working tree is never modified.
          922: 
          923: ```bash
          924: # Dry-run: preview matched hunks without staging
          925: python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-hunk-from-diff.py \
          926:     --file .agents/skills/foo/SKILL.md \
          927:     --match "blockquote" \
          928:     --check
          929: 
          930: # Stage only hunks containing a specific substring:
          931: python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-hunk-from-diff.py \
          932:     --file .agents/skills/foo/SKILL.md \
          933:     --match "Phase 1g"
          934: 
          935: # Stage hunks matching ANY of multiple patterns:
          936: python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-hunk-from-diff.py \
          937:     --file .agents/skills/foo/SKILL.md \
          938:     --match "stash-apply" \
          939:     --match "live editor"
          940: 
          941: # Stage hunks from a regex pattern:
          942: python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-hunk-from-diff.py \
          943:     --file .agents/skills/foo/SKILL.md \
          944:     --match-regex "Phase\s+1[g-h]"
          945: 
          946: # Stage hunks from the staged diff (--cached) instead of the working tree:
          947: python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-hunk-from-diff.py \
          948:     --file .agents/skills/foo/SKILL.md \
          949:     --match "submodule" \
          950:     --cached
          951: ```
          952: 
          953: **How it works:**
          954: 
          955: 1. Runs `git diff [--cached] -- <file>` to capture the full patch.
          956: 2. Parses the unified diff into a header (before the first `@@`) and a
          957:    list of hunks (each `@@ ... @@` block with its context and changes).
          958: 3. For each hunk, checks whether ANY of the `--match` substrings or
          959:    `--match-regex` patterns appear anywhere in the hunk text (context
          960:    lines, old lines, AND new lines).
          961: 4. Reconstructs a filtered patch from the header + matching hunks only.
          962: 5. Runs `git apply --cached` with the filtered patch to stage exactly
          963:    those hunks into the index. Non-matching hunks remain unstaged.
          964: 
          965: **Complementary primitives (delegated to base skill `git-hunk-staging-primitives`):**
          966: 
          967: | Script | Action | Used in |
          968: |---|---|---|
          969: | `stage-hunk-from-diff.py` | Stage ONLY matching hunks | §3i (this section) |
          970: | `stage-file-excluding-lines.py` | Stage file MINUS matching lines | §2f.1 |
          971: | `agents-md-stage-row.py` | Stage exactly one AGENTS.md row | §2f |
          972: | `stage-head-synthesize.py` | Stage HEAD with substitutions | §13 |
          973: | `stage-specific-hunks.py` | Stage specific hunk indices | §3i.1, §13 |
          974: | `git add -p` | Interactive hunk-by-hunk staging | §3a–§3f |
          975: 
          976: **Edge cases:**
          977: 
          978: - **Zero hunks matched:** exits with error. Use `--check` to preview.
          979: - **File has no diff:** exits with error (nothing to extract).
          980: - **Filtered patch wouldn't apply:** `--check` reveals the issue.
          981:   Common causes: the index has drifted from HEAD (e.g., some changes
          982:   already staged for this file). Use `--cached` to target staged
          983:   changes, or commit/reset the existing staged content first.
          984: 
          985: **See also:** `stage-hunk-from-diff.py --help` for full argument docs.
          986: 
          987: #### 3i.1 — Adjacent-Lines Isolation (git add -p Split Failure Fallback)
          988: 
          989: When `git add -p` presents a single hunk with multiple adjacent
          990: added or deleted lines and `s` (split) returns "Sorry, cannot split
          991: this hunk," the lines are too close (no intervening context line) for
          992: Git's hunk-split algorithm. `stage-hunk-from-diff.py` (§3i) stages
          993: the ENTIRE hunk when ANY line matches your filter — it cannot isolate
          994: individual adjacent lines within a hunk.
          995: 
          996: **Preferred fallback:** `stage-file-excluding-lines.py` (§2f.1) stages
          997: the file with the unwanted line(s) EXCLUDED, leaving the working tree
          998: untouched. The excluded line stays on disk and is picked up cleanly by
          999: `git add <file>` in the next commit.
          1000: 
          1001: **Example — two adjacent additions, each needs its own commit:**
          1002: 
          1003: ```bash
          1004: # Commit 1: stage the file minus the second addition
          1005: python3 .agents/skills/git-hunk-staging-primitives/scripts/stage-file-excluding-lines.py \
          1006:     --file <file> \
          1007:     --exclude "<content-of-second-line>"
          1008: 
          1009: git commit …   # only the first line change is committed
          1010: 
          1011: # Commit 2: HEAD now has the first line; working tree still has both.
          1012: # git add sees only the second line as a delta from HEAD:
          1013: git add <file>
          1014: git commit …   # only the second line change is committed
          1015: ```
          1016: 
          1017: **How it works** (re-stated for this use case, SSOT is §2f.1):
          1018: 
          1019: 1. Reads the CURRENT working-tree version of `<file>`.
          1020: 2. Removes every line matching `--exclude`.
          1021: 3. Writes the result as a new blob via `git hash-object -w`.
          1022: 4. Updates the index entry via `git update-index --cacheinfo`.
          1023: 5. Working tree is never modified — the excluded line persists on disk.
          1024: 
          1025: **Why prefer this over manual editing (Intermediate State Synthesis,
          1026: §13):**
          1027: 
          1028: - Zero working-tree mutation — no risk of forgetting the restore step.
          1029: - The index blob is computed from the exact working-tree content
          1030:   (minus matched lines) — no accidental whitespace drift from a
          1031:   manual copy.
          1032: - Audit trail: the script logs the excluded line content + blob SHA
          1033:   to stderr.
          1034: 
          1035: **When manual editing is still appropriate (fallback to §13):**
          1036: 
          1037: - The script is unavailable (no `.agents/` tree, or Python not on PATH).
          1038: - Lines to exclude span multiple non-adjacent positions (one
          1039:   `--exclude` call handles one line; for scattered exclusions, manual
          1040:   may be faster).
