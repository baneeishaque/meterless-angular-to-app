          +  private unsubscribe?: () => void;
          +
          +  start(): void {
          +    if (this.unsubscribe) {
          +      return;
          +    }
          +
          +    this.unsubscribe = this.world.subscribe((event) => this.apply(event));
          +  }
          +
          +  stop(): void {
          +    this.unsubscribe?.();
          +    this.unsubscribe = undefined;
          +  }
